
{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<div class="card" style="max-width:460px;margin:35px auto;">

    <h1 style="text-align:center;">
        Admin Login
    </h1>

    <p style="text-align:center;color:#64748b;">
        Binary Brains Hospital Management
    </p>

    <form method="POST"
          action="{{ url_for('admin_login') }}">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Admin Username</label>

        <input type="text"
               name="username"
               placeholder="Enter admin username"
               autocomplete="username"
               required>

        <label>Admin Password</label>

        <input type="password"
               name="password"
               placeholder="Enter admin password"
               autocomplete="current-password"
               required>

        <button class="btn"
                type="submit"
                style="width:100%;">
            Login as Admin
        </button>

    </form>

    <p style="text-align:center;">
        <a href="{{ url_for('home') }}">
            Back to Home
        </a>
    </p>

</div>

{% endblock %}
