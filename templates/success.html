<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Successful</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f5fa;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 18px #00000015;
        }

        .success-icon {
            font-size: 65px;
            color: green;
        }

        h2 { color: #087eaa; }

        .details {
            text-align: left;
            background: #f4f8fb;
            padding: 18px;
            border-radius: 8px;
            line-height: 2;
        }

        .status {
            color: #d58b00;
            font-weight: bold;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            margin: 8px;
            background: #087eaa;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success-icon">✓</div>

    <h2>Appointment Booked Successfully!</h2>

    <p>Thank you, {{ patient_name }}.</p>

    <div class="details">

        <strong>Patient Name:</strong>
        {{ patient_name }}<br>

        <strong>Doctor Name:</strong>
        {{ doctor_name }}<br>

        <strong>Date:</strong>
        {{ appointment_date }}<br>

        <strong>Time:</strong>
        {{ appointment_time }}<br>

        <strong>Status:</strong>
        <span class="status">
            {{ appointment_status }}
        </span>

    </div>

    <br>

    <a href="{{ url_for('my_appointments') }}">
        My Appointments
    </a>

    <a href="{{ url_for('dashboard') }}">
        Dashboard
    </a>

</div>

</body>
</html>
